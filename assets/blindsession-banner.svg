<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e14;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff9d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00b3ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00b3ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff9d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff9d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00b3ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="220" rx="16" fill="url(#bgGrad)"/>

  <!-- Logo shield on left -->
  <g transform="translate(50, 30)">
    <path d="M 80 10 L 125 30 L 125 80 Q 125 115 80 140 Q 35 115 35 80 L 35 30 Z"
          fill="none" stroke="url(#shieldGrad)" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="80" cy="75" rx="35" ry="20" fill="none" stroke="url(#eyeGrad)" stroke-width="3"/>
    <circle cx="80" cy="75" r="8" fill="url(#eyeGrad)"/>
    <line x1="48" y1="47" x2="112" y2="103" stroke="#ff4d4d" stroke-width="4" stroke-linecap="round"/>
    <rect x="72" y="110" width="16" height="12" rx="2" fill="url(#shieldGrad)"/>
    <path d="M 75 110 L 75 105 Q 75 101 80 101 Q 85 101 85 105 L 85 110" fill="none" stroke="url(#shieldGrad)" stroke-width="2"/>
  </g>

  <!-- Title text -->
  <text x="260" y="95" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#textGrad)">BlindSession</text>

  <!-- Tagline -->
  <text x="262" y="130" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#8892a6" font-weight="400">Server-blind end-to-end encrypted messaging</text>

  <!-- Decorative dots -->
  <circle cx="262" cy="160" r="4" fill="#00ff9d"/>
  <circle cx="280" cy="160" r="4" fill="#00b3ff"/>
  <circle cx="298" cy="160" r="4" fill="#8892a6" opacity="0.4"/>

  <!-- Right side: encrypted message mockup -->
  <g transform="translate(620, 55)">
    <rect x="0" y="0" width="230" height="32" rx="16" fill="rgba(0,255,157,0.08)" stroke="rgba(0,255,157,0.2)" stroke-width="1"/>
    <text x="14" y="21" font-family="monospace" font-size="11" fill="#00ff9d">a3f8e2c1d4b5...</text>
    <rect x="10" y="42" width="210" height="28" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="24" y="60" font-family="monospace" font-size="11" fill="#8892a6">7b2e9f1a4c8d...</text>
    <rect x="0" y="80" width="190" height="28" rx="14" fill="rgba(0,179,255,0.08)" stroke="rgba(0,179,255,0.2)" stroke-width="1"/>
    <text x="14" y="98" font-family="monospace" font-size="11" fill="#00b3ff">e9c4b7f2a1d3...</text>
  </g>
</svg>

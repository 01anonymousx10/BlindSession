<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e14;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff9d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00b3ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00b3ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff9d;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="10" y="10" width="180" height="180" rx="40" ry="40" fill="url(#bgGrad)" stroke="url(#shieldGrad)" stroke-width="2"/>

  <!-- Shield outline -->
  <path d="M 100 35 L 145 55 L 145 105 Q 145 140 100 165 Q 55 140 55 105 L 55 55 Z"
        fill="none" stroke="url(#shieldGrad)" stroke-width="3" stroke-linejoin="round"/>

  <!-- Eye shape (blind = closed eye with slash) -->
  <ellipse cx="100" cy="100" rx="35" ry="20" fill="none" stroke="url(#eyeGrad)" stroke-width="3"/>

  <!-- Iris circle -->
  <circle cx="100" cy="100" r="8" fill="url(#eyeGrad)"/>

  <!-- Blind slash through the eye -->
  <line x1="68" y1="72" x2="132" y2="128" stroke="#ff4d4d" stroke-width="4" stroke-linecap="round"/>

  <!-- Small lock at bottom of shield -->
  <rect x="92" y="135" width="16" height="12" rx="2" fill="url(#shieldGrad)"/>
  <path d="M 95 135 L 95 130 Q 95 126 100 126 Q 105 126 105 130 L 105 135" fill="none" stroke="url(#shieldGrad)" stroke-width="2"/>
</svg>
